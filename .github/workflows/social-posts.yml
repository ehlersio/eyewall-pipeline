name: Social Posts

# Automatic Instagram + Facebook Page posts (social_posts.py):
#   rankings  Mondays      -- weekly power rankings
#   winners   daily        -- projected winners, skipped on days with no games
#   recap     Mondays      -- last week's projected winners, graded
#   leaders   Tuesdays     -- last week's + season leaders, goals above expected
#   pwhl-winners  daily      -- PWHL projected winners, skipped with no PWHL games
#   pwhl-recap    Tuesdays   -- last week's PWHL projected winners, graded
#   minor-recap   Wednesdays -- AHL + ECHL: last week graded + top scorer
#   pwhl-leaders  Thursdays  -- last week's + season PWHL leaders
#   milk-carton   Mondays    -- the week's roughest NHL week, on a milk carton
#                              (milk_carton.py)
#   goal-of-week  Fridays    -- last Mon-Sun's Goal of the Week, a Reel redrawn
#                              from NHL tracking data (goal_of_week.py)
# (the pwhl-*/minor-* posts are social_posts_leagues.py, milk-carton is
# milk_carton.py, goal-of-week is goal_of_week.py)
#
# Times are UTC and sit well after the nightly pipeline, which is scheduled
# for 07:00 UTC but in practice has been starting 12:00-13:30 UTC and taking
# ~10 minutes. Each post has a backup run an hour later: if the first run
# found stale data (exit 1) the backup tries again, and if the first run
# already published, the backup sees it in social_posts and does nothing
# (a platform that failed is retried on its own).
#   rankings  15:00 / 16:00 Mon  (11am / noon EDT; 10am / 11am EST)
#   winners   15:30 / 16:30 daily (before the earliest matinee puck drops;
#             games already under way are left off the card anyway)
#   recap     18:00 / 19:00 Mon  (2pm / 3pm EDT)
#   leaders   17:00 / 18:00 Tue  (1pm / 2pm EDT) -- reads the NHL stats API
#             and MoneyPuck directly, so it doesn't wait on the nightly
#   pwhl-winners  15:45 / 16:45 daily (11:45am ET, before the earliest
#                 PWHL puck drop; hockeytech_elo.py logs them at ~3:20am ET)
#   pwhl-recap    20:00 / 21:00 Tue
#   minor-recap   17:00 / 18:00 Wed
#   pwhl-leaders  17:00 / 18:00 Thu
#   milk-carton   21:00 / 22:00 Mon (5pm / 6pm EDT) -- NHL stats API and
#                 MoneyPuck, which has Sunday's games by Monday afternoon
#   goal-of-week  17:00 / 18:00 Fri (1pm / 2pm EDT) -- NHL game center and
#                 tracking replays directly, so it doesn't wait on the nightly;
#                 Friday has no other post

on:
  schedule:
    - cron: '0 15 * * 1'
    - cron: '0 16 * * 1'
    - cron: '30 15 * * *'
    - cron: '30 16 * * *'
    - cron: '0 18 * * 1'
    - cron: '0 19 * * 1'
    - cron: '0 17 * * 2'
    - cron: '0 18 * * 2'
    - cron: '45 15 * * *'
    - cron: '45 16 * * *'
    - cron: '0 20 * * 2'
    - cron: '0 21 * * 2'
    - cron: '0 17 * * 3'
    - cron: '0 18 * * 3'
    - cron: '0 17 * * 4'
    - cron: '0 18 * * 4'
    - cron: '0 21 * * 1'
    - cron: '0 22 * * 1'
    - cron: '0 17 * * 5'
    - cron: '0 18 * * 5'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Which post (check = read-only credentials test, posts nothing)'
        required: true
        type: choice
        options: [winners, rankings, recap, leaders, pwhl-winners, pwhl-recap, minor-recap, pwhl-leaders, milk-carton, goal-of-week, check]
      dry_run:
        description: 'Render only (images / video kept as a run artifact), no upload or post'
        type: boolean
        default: true
      date:
        description: 'Optional ET date (YYYY-MM-DD) to run as, e.g. a past week for a dry run'
        type: string
        required: false

concurrency:
  group: social-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the post for this trigger
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_KIND: ${{ inputs.kind }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          case "$SCHEDULE" in
            '0 15 * * 1'|'0 16 * * 1')  kind=rankings ;;
            '30 15 * * *'|'30 16 * * *') kind=winners ;;
            '0 18 * * 1'|'0 19 * * 1')  kind=recap ;;
            '0 17 * * 2'|'0 18 * * 2')  kind=leaders ;;
            '45 15 * * *'|'45 16 * * *') kind=pwhl-winners ;;
            '0 20 * * 2'|'0 21 * * 2')  kind=pwhl-recap ;;
            '0 17 * * 3'|'0 18 * * 3')  kind=minor-recap ;;
            '0 17 * * 4'|'0 18 * * 4')  kind=pwhl-leaders ;;
            '0 21 * * 1'|'0 22 * * 1')  kind=milk-carton ;;
            '0 17 * * 5'|'0 18 * * 5')  kind=goal-of-week ;;
            '') kind="$INPUT_KIND" ;;
            *) echo "Unmapped schedule: $SCHEDULE"; exit 1 ;;
          esac
          flag=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then flag="--dry-run"; fi
          if [ -n "$INPUT_DATE" ]; then
            case "$INPUT_DATE" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) flag="$flag --date $INPUT_DATE" ;;
              *) echo "date must be YYYY-MM-DD, got: $INPUT_DATE"; exit 1 ;;
            esac
          fi
          script=social_posts.py
          case "$kind" in
            pwhl-*|minor-*) script=social_posts_leagues.py ;;
            milk-carton) script=milk_carton.py ;;
            goal-of-week) script=goal_of_week.py ;;
          esac
          echo "script=$script" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "flag=$flag" >> "$GITHUB_OUTPUT"

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # goal_of_week.py encodes its clip with ffmpeg. GitHub's Ubuntu images
      # ship it; install only if an image ever doesn't.
      - name: Ensure ffmpeg
        if: steps.pick.outputs.kind == 'goal-of-week'
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Post
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NHL_SEASON: ${{ secrets.NHL_SEASON }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python ${{ steps.pick.outputs.script }} ${{ steps.pick.outputs.kind }} ${{ steps.pick.outputs.flag }}

      - name: Keep dry-run images
        if: steps.pick.outputs.flag == '--dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: social-${{ steps.pick.outputs.kind }}
          path: social_out/
          if-no-files-found: ignore
