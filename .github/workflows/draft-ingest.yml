name: Draft Day Ingest

on:
  schedule:
    # Round 1 — 10:45 PM UTC = 6:45 PM ET June 26 (draft starts 7pm ET, buffer to catch first pick)
    - cron: '45 22 26 6 *'
    # Rounds 2–7 — 2:00 PM UTC = 10:00 AM ET June 27
    - cron: '0 14 27 6 *'
  workflow_dispatch: # manual backup trigger

# One run at a time: a manual or Worker dispatch overlapping a late scheduled
# run would otherwise double-run the delete-then-insert writers. Queued, not
# cancelled.
concurrency:
  group: draft-ingest
  cancel-in-progress: false

# The default GITHUB_TOKEN is read-only at the repository level too; this
# block makes that explicit per workflow (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6hr GH Actions limit — covers full draft day

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Purge stale draft picks KV cache
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          # This log is public: print only whether the lookup worked, never
          # the response (it lists every KV namespace on the account).
          CF_RESPONSE=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            -H "Authorization: Bearer $CLOUDFLARE_API_KEY")

          if ! NS_ID=$(echo "$CF_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); m=next((n['id'] for n in d.get('result') or [] if n['title']=='eyewall-cache'),None); sys.exit(1) if not (d.get('success') and m) else print(m)" 2>/dev/null); then
            echo "Cloudflare KV namespace lookup failed (API error, or no eyewall-cache namespace)"
            exit 1
          fi
          echo "Cloudflare KV namespace lookup succeeded"

          KEYS=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$NS_ID/keys?prefix=draft%3Apicks%3A2026" \
            -H "Authorization: Bearer $CLOUDFLARE_API_KEY" | \
            python3 -c "import sys,json; [print(k['name']) for k in json.load(sys.stdin).get('result', [])]")

          if [ -z "$KEYS" ]; then
            echo "No stale draft picks keys found — nothing to purge."
          else
            echo "$KEYS" | while read KEY; do
              ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$KEY")
              curl -s -X DELETE \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$NS_ID/values/$ENCODED" \
                -H "Authorization: Bearer $CLOUDFLARE_API_KEY"
              echo "Deleted: $KEY"
            done
          fi

      - name: Poll picks until draft complete
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          EYEWALL_POLL_SECRET: ${{ secrets.EYEWALL_POLL_SECRET }}
        run: |
          echo "Starting draft pick polling loop..."
          while true; do
            python draft_ingest.py --poll-picks
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 99 ]; then
              echo "All 224 picks inserted — draft complete. Exiting."
              break
            fi
            echo "Sleeping 60s before next poll..."
            sleep 60
          done

      - name: Summary
        if: always()
        run: echo "Draft ingest job finished."

      - name: Notify on failure
        if: failure()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          POLL_SECRET: ${{ secrets.EYEWALL_POLL_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "${WORKER_URL:-https://eyewall-poller.billowing-queen-bf23.workers.dev}/ops/notify" -H "X-Poll-Secret: $POLL_SECRET" -H 'content-type: application/json' -d "{\"source\":\"draft-ingest.yml\",\"status\":\"failure\",\"title\":\"Draft Day Ingest failed\",\"body\":\"$RUN_URL\",\"url\":\"$RUN_URL\"}"

      - name: Report success
        if: success()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          POLL_SECRET: ${{ secrets.EYEWALL_POLL_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "${WORKER_URL:-https://eyewall-poller.billowing-queen-bf23.workers.dev}/ops/notify" -H "X-Poll-Secret: $POLL_SECRET" -H 'content-type: application/json' -d "{\"source\":\"draft-ingest.yml\",\"status\":\"ok\",\"title\":\"Draft Day Ingest succeeded\",\"body\":\"$RUN_URL\",\"url\":\"$RUN_URL\"}"
