name: SBNation News Ingest

on:
  schedule:
    # Every 4 hours — blog posts don't need same-30-min freshness, and this
    # ran alongside a Reddit fetch every 30 min for months even though
    # Reddit has blocked GH Actions runner IPs the whole time (see README's
    # Known Limitations) — that half was pure wasted Actions minutes,
    # dropped here along with the frequency.
    - cron: '0 */4 * * *'
  workflow_dispatch: # allow manual trigger
  push:
    branches: [session-news-ingestion-fixes] # TEMP: verify new feeds live before PR

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch all SBNation atom feeds and POST to worker
        run: |
          # All SBNation/Vox Media blogs block Cloudflare datacenter IPs.
          # GH-hosted runners are not blocked — fetch here and POST to worker.
          declare -A FEEDS=(
            # Only feeds confirmed reachable from GH-hosted runners.
            # These five are on the older Vox platform (true Atom XML at
            # the legacy /rss/current.xml path).
            [canescountry]="https://www.canescountry.com/rss/current.xml"
            [lighthousehockey]="https://www.lighthousehockey.com/rss/current.xml"
            [milehighhockey]="https://www.milehighhockey.com/rss/current.xml"
            [pensburgh]="https://www.pensburgh.com/rss/current.xml"
            [allaboutthejersey]="https://www.allaboutthejersey.com/rss/current.xml"
            # Added Session: news ingestion investigation -- 19 more
            # SBNation/Vox team blogs, closing the gap left by Reddit
            # ingestion being removed entirely (blocked from both
            # Cloudflare Workers and GH Actions runner IPs, confirmed
            # live). Most of these are on the newer Vox platform, serving
            # plain RSS 2.0 at /feed/ rather than true Atom -- the
            # Worker's /atom/ingest route auto-detects format per source,
            # no config needed here beyond a working URL. ids must match
            # eyewall-poller's TEAM_NEWS_SOURCES exactly (that's the join
            # key /atom/ingest uses to route each feed to its team).
            [anaheimcalling]="https://www.anaheimcalling.com/feed/"
            [stanleycupofchowder]="https://www.stanleycupofchowder.com/rss/index.xml"
            [diebytheblade]="https://www.diebytheblade.com/feed/"
            [secondcityhockey]="https://www.secondcityhockey.com/feed/"
            [jacketscannon]="https://www.jacketscannon.com/feed/"
            [defendingbigd]="https://www.defendingbigd.com/feed/"
            [wingingitinmotown]="https://www.wingingitinmotown.com/feed/"
            [litterboxcats]="https://www.litterboxcats.com/feed/"
            [jewelsfromthecrown]="https://www.jewelsfromthecrown.com/feed/"
            [eyesontheprize]="https://www.eyesontheprize.com/rss/current.xml"
            [ontheforecheck]="https://www.ontheforecheck.com/feed/"
            [blueshirtbanter]="https://www.blueshirtbanter.com/rss/"
            [silversevensens]="https://www.silversevensens.com/rss/"
            [broadstreethockey]="https://www.broadstreethockey.com/feed/"
            [fearthefin]="https://www.fearthefin.com/feed/"
            [stlouisgametime]="https://www.stlouisgametime.com/rss/current.xml"
            [rawcharge]="https://www.rawcharge.com/feed/"
            [knightsonice]="https://www.knightsonice.com/feed/"
            [japersrink]="https://www.japersrink.com/feed/"
          )

          TMPDIR=$(mktemp -d)
          BUNDLE="{}"

          for sourceId in "${!FEEDS[@]}"; do
            feedUrl="${FEEDS[$sourceId]}"
            echo "Fetching $sourceId..."
            TMPFILE="$TMPDIR/$sourceId.xml"
            curl -fsSL \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              -H "Accept: application/rss+xml,application/atom+xml,text/xml,*/*" \
              "$feedUrl" -o "$TMPFILE" 2>/dev/null || true

            if [ ! -s "$TMPFILE" ] || [ "$(wc -c < "$TMPFILE")" -lt 100 ]; then
              echo "  Skipping $sourceId (empty response)"
              rm -f "$TMPFILE"
              continue
            fi

            # Use --rawfile to avoid ARG_MAX limits on large XML blobs
            BUNDLE=$(jq --rawfile v "$TMPFILE" --arg k "$sourceId" '. + {($k): $v}' <<< "$BUNDLE")
            sleep 0.3
          done

          rm -rf "$TMPDIR"

          FEED_COUNT=$(echo "$BUNDLE" | jq 'keys | length')
          echo "Atom bundle: $FEED_COUNT feeds"

          HTTP_STATUS=$(echo "$BUNDLE" | curl -s -o response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-ingest-secret: ${{ secrets.EYEWALL_POLL_SECRET }}" \
            --data-binary @- \
            "https://eyewall-poller.billowing-queen-bf23.workers.dev/atom/ingest")

          echo "Atom ingest: $HTTP_STATUS"
          cat response.txt

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Atom ingest failed with status $HTTP_STATUS"
            exit 1
          fi
