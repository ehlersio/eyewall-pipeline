name: EyeWall Live Score Refresh

# Manual backfill only (since 2026-10). The Worker (eyewall-poller's
# hockeytech.js pollGame / pwhl.js pollPWHLGame) now writes each AHL/ECHL/PWHL
# game's live state at puck drop and its final score the minute it ends,
# straight to {league}_game_log. This workflow's old */5 schedule actually
# fired every 3-10 hours (GitHub cron lateness), so it was never the live
# source anyway. Run it by hand to re-sync game_state/game_status_code/
# scores/ended_in for today's games if the Worker missed one.

on:
  workflow_dispatch:

concurrency:
  group: live-score-refresh
  cancel-in-progress: false

jobs:
  refresh-live-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ahl_live_refresh.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ahl_live_refresh.py

      - name: Run pwhl_live_refresh.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pwhl_live_refresh.py

      - name: Run echl_live_refresh.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python echl_live_refresh.py

      - name: Notify on failure
        if: failure()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          POLL_SECRET: ${{ secrets.EYEWALL_POLL_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "${WORKER_URL:-https://eyewall-poller.billowing-queen-bf23.workers.dev}/ops/notify?secret=$POLL_SECRET" -H 'content-type: application/json' -d "{\"source\":\"live-score-refresh.yml\",\"status\":\"failure\",\"title\":\"EyeWall Live Score Refresh failed\",\"body\":\"$RUN_URL\",\"url\":\"$RUN_URL\"}"

      - name: Report success
        if: success()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          POLL_SECRET: ${{ secrets.EYEWALL_POLL_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "${WORKER_URL:-https://eyewall-poller.billowing-queen-bf23.workers.dev}/ops/notify?secret=$POLL_SECRET" -H 'content-type: application/json' -d "{\"source\":\"live-score-refresh.yml\",\"status\":\"ok\",\"title\":\"EyeWall Live Score Refresh succeeded\",\"body\":\"$RUN_URL\",\"url\":\"$RUN_URL\"}"
