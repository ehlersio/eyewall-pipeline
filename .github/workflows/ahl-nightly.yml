name: EyeWall AHL Nightly Pipeline

on:
  schedule:
    - cron: '40 7 * * *'  # 3:40 AM ET (UTC-4 during EDT) — offset 20min after PWHL pipeline
  workflow_dispatch:
    inputs:
      season_id:
        description: 'HockeyTech season_id to backfill (blank = live-resolve "current" season, same as the nightly cron)'
        required: false
        default: ''

# One run at a time: a manual or Worker dispatch overlapping a late scheduled
# run would otherwise double-run the delete-then-insert writers. Queued, not
# cancelled.
concurrency:
  group: ahl-nightly
  cancel-in-progress: false

# gh run list (the "Skip if already ran today" guard) needs actions: read.
permissions:
  actions: read
  contents: read

jobs:
  run-ahl-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: .

    steps:
      - name: Skip if already ran today
        id: guard
        # The Worker dispatches this workflow once a day (eyewall-poller
        # src/dispatch.js); the cron above is only the fallback. A scheduled
        # run skips when a run already succeeded today (UTC). A
        # workflow_dispatch run (the Worker's, or a manual one) never skips.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ahl-nightly.yml --status success --created ">=$(date -u +%Y-%m-%dT00:00:00Z)" --json databaseId --jq length) || n=0
          echo "Successful ahl-nightly.yml runs today (UTC): ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout repo
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run ahl_news.py (fetch RSS news, POST to Worker)
        if: steps.guard.outputs.skip != 'true'
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          EYEWALL_POLL_SECRET: ${{ secrets.EYEWALL_POLL_SECRET }}
        run: python ahl_news.py
        # Independent of the rest of this workflow (no Supabase dependency,
        # no season_id) -- placed first so a news-source outage never
        # blocks the stats/box-score/shot-event ingestion below it, same
        # ordering rationale as pwhl-nightly.yml's own pwhl_news.py step.

      - name: Run ahl_stats.py (rosters, player/goalie/team stats, game log)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ahl_stats.py "${{ inputs.season_id }}"
        # Populates ahl_game_log (which games are Final), ahl_players,
        # ahl_player_seasons, ahl_goalie_seasons, ahl_team_seasons.
        # Everything below this step depends on ahl_game_log/ahl_players
        # being current. Season is live-resolved from HockeyTech's own
        # seasons feed when season_id is blank (the scheduled cron always
        # passes blank -- see ahl_stats.py's module docstring for why this
        # doesn't go through season_lookup.py's Worker pattern yet) — no
        # AHL_SEASON secret needed. A manual workflow_dispatch run can pass
        # a specific season_id to backfill a season the live resolver
        # would never pick on its own (e.g. the most recently COMPLETED
        # regular season, once resolve_current_season() has moved on to
        # that season's playoffs or the next regular season).

      - name: Run ahl_game_boxscore.py (per-game player box score)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ahl_game_boxscore.py "${{ inputs.season_id }}"
        # Populates ahl_skater_game_box/ahl_goalie_game_box -- per-game
        # granularity ahl_player_seasons/ahl_goalie_seasons don't have.
        # Reads completed games from ahl_game_log, so must run after the
        # ahl_stats.py step above. Skips games already in
        # ahl_skater_game_box or ahl_skipped_games (idempotent by default).

      - name: AHL goal on-ice rosters (hockeytech_goal_on_ice.py)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python hockeytech_goal_on_ice.py ahl "${{ inputs.season_id }}"
        # ahl_goal_on_ice: the skaters on the ice for every goal, from
        # gameSummary (read by eyewall-poller's /ahl/game-box `goals`).
        # Needs ahl_game_log from the stats step. Table:
        # docs/2026-10-07_hockeytech_goal_on_ice.sql (skips, logged, until
        # that's been run).

      - name: Ingest AHL shot events (goals + shots with coordinates)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ahl_shot_events.py "${{ inputs.season_id }}"
        # Skips games already in ahl_shot_events or ahl_skipped_games
        # (idempotent by default). Goal rows already carry assists/PP/SH/
        # EN/GWG flags straight from the PBP goal event -- no gameSummary
        # merge step needed (unlike PWHL's pipeline), so there's no
        # equivalent of pwhl_stats.py's --gw-goals-rollup-only step here.
        # Reads completed games from ahl_game_log for this season_id, so
        # this step only finds work once the ahl_stats.py step above has
        # populated that season's game log.

      - name: Ingest AHL penalty shots
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ahl_penalty_shots.py "${{ inputs.season_id }}"
        # Skips games already in ahl_penalty_shots or ahl_skipped_games
        # (idempotent by default). Independent of the shot-events step
        # above (own PBP fetch, own skip-tracking pipeline name) -- order
        # relative to it doesn't matter, placed last for readability.

      - name: AHL shot-location xG proxy (hockeytech_shot_xg.py)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python hockeytech_shot_xg.py ahl "${{ inputs.season_id }}"
        # ahl_player_xg from ahl_shot_events, so after the shot-events step.
        # Tables: docs/2026-10-07_hockeytech_percentiles.sql (logs one error
        # and skips until that's been run).

      - name: AHL skater percentiles, per game played (hockeytech_percentiles.py)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python hockeytech_percentiles.py ahl "${{ inputs.season_id }}"
        # Reads ahl_player_seasons (stats step), assists from
        # ahl_shot_events and finishing from ahl_player_xg (the step above).

      - name: AHL goalie percentiles, per game played (hockeytech_goalie_percentiles.py)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python hockeytech_goalie_percentiles.py ahl "${{ inputs.season_id }}"
        # Reads ahl_goalie_seasons, ahl_shot_events, ahl_game_log and
        # ahl_goalie_game_box (credits each goal to the goalie who allowed it).

      - name: AHL Elo ratings + win probabilities (hockeytech_elo.py)
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python hockeytech_elo.py ahl
        # Full replay from HockeyTech's schedule feed (2023-24 onward), so it
        # doesn't depend on the ingestion steps above and runs even if one of
        # them failed. Writes ahl_team_elo_ratings (read by eyewall-poller's
        # /ahl/prediction) and ahl_game_win_probs for today's/tomorrow's
        # games. Tables: docs/hockeytech_elo_ddl.sql.

      - name: AHL milestones (hockeytech_milestones.py)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NHL_SEASON: ${{ secrets.NHL_SEASON }}
        run: python hockeytech_milestones.py ahl
        # Hat tricks, SH goals, shutouts, season goal/point thresholds for
        # the last 3 ET days, into the shared milestones table (sport =
        # 'ahl'). Reads ahl_game_log/ahl_player_seasons (stats step),
        # ahl_shot_events and ahl_goalie_game_box. Needs
        # docs/2026-10-07_milestones_sport.sql (logs once and moves on until
        # then). NHL_SEASON: db.py resolves it at import.

      - name: Generate daily AHL trivia (easy + medium)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PWHL_SEASON: ${{ secrets.PWHL_SEASON }}
          NHL_SEASON: ${{ secrets.NHL_SEASON }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python trivia_questions.py --sport ahl
        # Reads ahl_player_seasons (stats step). NHL_SEASON/PWHL_SEASON
        # are env fallbacks for modules trivia_questions.py imports at load,
        # as in pwhl-nightly.yml's trivia step.

      - name: Notify on failure
        if: failure()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          POLL_SECRET: ${{ secrets.EYEWALL_POLL_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "${WORKER_URL:-https://eyewall-poller.billowing-queen-bf23.workers.dev}/ops/notify?secret=$POLL_SECRET" -H 'content-type: application/json' -d "{\"source\":\"ahl-nightly.yml\",\"status\":\"failure\",\"title\":\"EyeWall AHL Nightly Pipeline failed\",\"body\":\"$RUN_URL\",\"url\":\"$RUN_URL\"}"

      - name: Report success
        if: success()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          POLL_SECRET: ${{ secrets.EYEWALL_POLL_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "${WORKER_URL:-https://eyewall-poller.billowing-queen-bf23.workers.dev}/ops/notify?secret=$POLL_SECRET" -H 'content-type: application/json' -d "{\"source\":\"ahl-nightly.yml\",\"status\":\"ok\",\"title\":\"EyeWall AHL Nightly Pipeline succeeded\",\"body\":\"$RUN_URL\",\"url\":\"$RUN_URL\"}"
