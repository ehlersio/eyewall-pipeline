name: MoneyPuck Daily Ingest

on:
  schedule:
    # 6:00 AM ET daily (MoneyPuck updates overnight)
    - cron: '0 10 * * *'
  workflow_dispatch: # allow manual trigger; the Worker dispatches it daily

# One run at a time: a manual or Worker dispatch overlapping a late scheduled
# run would otherwise double-run the delete-then-insert writers. Queued, not
# cancelled.
concurrency:
  group: moneypuck-ingest
  cancel-in-progress: false

# gh run list (the "Skip if already ran today" guard) needs actions: read.
permissions:
  actions: read
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip if already ran today
        id: guard
        # The Worker dispatches this workflow once a day (eyewall-poller
        # src/dispatch.js); the cron above is only the fallback. A scheduled
        # run skips when a run already succeeded today (UTC). A
        # workflow_dispatch run (the Worker's, or a manual one) never skips.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow moneypuck-ingest.yml --status success --created ">=$(date -u +%Y-%m-%dT00:00:00Z)" --json databaseId --jq length) || n=0
          echo "Successful moneypuck-ingest.yml runs today (UTC): ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Fetch MoneyPuck CSV
        if: steps.guard.outputs.skip != 'true'
        id: fetch
        run: |
          # PRIMARY_YEAR is MoneyPuck's season-start-year convention (e.g. 2025
          # for the 2025-26 season). It's fine -- expected, even -- to bump this
          # ahead of the real season flip each summer: MoneyPuck doesn't publish
          # a season's CSV until real games exist, so a too-early primary just
          # 404s and falls back to last year's data below instead of breaking
          # the ingest. Once MoneyPuck actually publishes the new season, the
          # primary fetch starts succeeding on its own -- no manual revert
          # needed. (This bit us 2026-07-16→07-20: PRIMARY_YEAR was bumped to
          # 2026 for an anticipated season flip that hadn't landed yet, and the
          # ingest hard-failed for 4 days straight with no fallback.)
          PRIMARY_YEAR=2026
          FALLBACK_YEAR=$((PRIMARY_YEAR - 1))

          fetch_year() {
            curl -sSL -o skaters.csv -w "%{http_code}" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              -H "Referer: https://moneypuck.com/" \
              "https://moneypuck.com/moneypuck/playerData/seasonSummary/$1/regular/skaters.csv"
          }

          # Data rows in what was just fetched (the header line doesn't count).
          data_rows() { echo $(( $(wc -l < skaters.csv) - 1 )); }

          YEAR_USED=$PRIMARY_YEAR
          STATUS=$(fetch_year "$PRIMARY_YEAR")
          # A new season's file can exist before any games do: on 2026-09-28
          # MoneyPuck served 2026/regular/skaters.csv as a 200 with only the
          # header row, the ingest sent that, and the Worker rejected it
          # (400, body under 100 bytes). No data rows counts as "not
          # published yet", same as a 404.
          if [ "$STATUS" != "200" ] || [ "$(data_rows)" -lt 1 ]; then
            echo "MoneyPuck has no published data for $PRIMARY_YEAR yet (HTTP $STATUS, $(data_rows) rows) -- falling back to $FALLBACK_YEAR"
            YEAR_USED=$FALLBACK_YEAR
            STATUS=$(fetch_year "$FALLBACK_YEAR")
          fi
          if [ "$STATUS" != "200" ] || [ "$(data_rows)" -lt 1 ]; then
            echo "MoneyPuck fetch failed for both $PRIMARY_YEAR and $FALLBACK_YEAR (HTTP $STATUS, $(data_rows) rows)"
            exit 1
          fi

          ROWS=$(wc -l < skaters.csv)
          echo "Fetched $ROWS lines (season start year $YEAR_USED)"
          echo "rows=$ROWS" >> $GITHUB_OUTPUT
          echo "year_used=$YEAR_USED" >> $GITHUB_OUTPUT

      - name: POST to EyeWall worker
        if: steps.guard.outputs.skip != 'true'
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: text/plain" \
            -H "x-ingest-secret: ${{ secrets.EYEWALL_POLL_SECRET }}" \
            --data-binary @skaters.csv \
            "https://eyewall-poller.billowing-queen-bf23.workers.dev/moneypuck/ingest")
          echo "Worker responded: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Ingest failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Summary
        if: steps.guard.outputs.skip != 'true'
        run: echo "MoneyPuck ingest complete — ${{ steps.fetch.outputs.rows }} rows (season start year ${{ steps.fetch.outputs.year_used }}) sent to worker"

      - name: Notify on failure
        if: failure()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          POLL_SECRET: ${{ secrets.EYEWALL_POLL_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "${WORKER_URL:-https://eyewall-poller.billowing-queen-bf23.workers.dev}/ops/notify?secret=$POLL_SECRET" -H 'content-type: application/json' -d "{\"source\":\"moneypuck-ingest.yml\",\"status\":\"failure\",\"title\":\"MoneyPuck Daily Ingest failed\",\"body\":\"$RUN_URL\",\"url\":\"$RUN_URL\"}"

      - name: Report success
        if: success()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          POLL_SECRET: ${{ secrets.EYEWALL_POLL_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "${WORKER_URL:-https://eyewall-poller.billowing-queen-bf23.workers.dev}/ops/notify?secret=$POLL_SECRET" -H 'content-type: application/json' -d "{\"source\":\"moneypuck-ingest.yml\",\"status\":\"ok\",\"title\":\"MoneyPuck Daily Ingest succeeded\",\"body\":\"$RUN_URL\",\"url\":\"$RUN_URL\"}"
