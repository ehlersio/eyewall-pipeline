name: EyeWall ECHL Nightly Pipeline

on:
  schedule:
    - cron: '0 8 * * *'  # 4:00 AM ET (UTC-4 during EDT) — offset 20min after AHL's pipeline
  workflow_dispatch:
    inputs:
      season_id:
        description: 'HockeyTech season_id to backfill (blank = live-resolve "current" season, same as the nightly cron)'
        required: false
        default: ''

# One run at a time: a manual or Worker dispatch overlapping a late scheduled
# run would otherwise double-run the delete-then-insert writers. Queued, not
# cancelled.
concurrency:
  group: echl-nightly
  cancel-in-progress: false

# gh run list (the "Skip if already ran today" guard) needs actions: read.
permissions:
  actions: read
  contents: read

jobs:
  run-echl-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: .

    steps:
      - name: Skip if already ran today
        id: guard
        # The Worker dispatches this workflow once a day (eyewall-poller
        # src/dispatch.js); the cron above is only the fallback. A scheduled
        # run skips when a run already succeeded today (UTC). A
        # workflow_dispatch run (the Worker's, or a manual one) never skips.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow echl-nightly.yml --status success --created ">=$(date -u +%Y-%m-%dT00:00:00Z)" --json databaseId --jq length) || n=0
          echo "Successful echl-nightly.yml runs today (UTC): ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout repo
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run echl_news.py (fetch RSS news, POST to Worker)
        if: steps.guard.outputs.skip != 'true'
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          EYEWALL_POLL_SECRET: ${{ secrets.EYEWALL_POLL_SECRET }}
        run: python echl_news.py
        # Independent of the rest of this workflow (no Supabase dependency,
        # no season_id) -- placed first so a news-source outage never
        # blocks the stats/box-score/shot-event ingestion below it, same
        # ordering rationale as ahl-nightly.yml's own ahl_news.py step.

      - name: Run echl_stats.py (rosters, player/goalie/team stats, game log)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python echl_stats.py "${{ inputs.season_id }}"
        # Populates echl_game_log (which games are Final), echl_players,
        # echl_player_seasons, echl_goalie_seasons, echl_team_seasons.
        # Everything below this step depends on echl_game_log/echl_players
        # being current.

      - name: Run echl_game_boxscore.py (per-game player box score)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python echl_game_boxscore.py "${{ inputs.season_id }}"

      - name: Ingest ECHL shot events (goals + shots with coordinates)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python echl_shot_events.py "${{ inputs.season_id }}"

      - name: Ingest ECHL penalty shots
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python echl_penalty_shots.py "${{ inputs.season_id }}"

      - name: ECHL Elo ratings + win probabilities (hockeytech_elo.py)
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python hockeytech_elo.py echl
        # Full replay from HockeyTech's schedule feed (2023-24 onward), so it
        # doesn't depend on the ingestion steps above and runs even if one of
        # them failed. Writes echl_team_elo_ratings (read by eyewall-poller's
        # /echl/prediction) and echl_game_win_probs for today's/tomorrow's
        # games. Tables: docs/hockeytech_elo_ddl.sql.

      - name: ECHL milestones (hockeytech_milestones.py)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NHL_SEASON: ${{ secrets.NHL_SEASON }}
        run: python hockeytech_milestones.py echl
        # Hat tricks, SH goals, shutouts, season goal/point thresholds for
        # the last 3 ET days, into the shared milestones table (sport =
        # 'echl'). Reads echl_game_log/echl_player_seasons (stats step),
        # echl_shot_events and echl_goalie_game_box. Needs
        # docs/2026-10-07_milestones_sport.sql (logs once and moves on until
        # then). NHL_SEASON: db.py resolves it at import.

      - name: Generate daily ECHL trivia (easy + medium)
        if: steps.guard.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PWHL_SEASON: ${{ secrets.PWHL_SEASON }}
          NHL_SEASON: ${{ secrets.NHL_SEASON }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python trivia_questions.py --sport echl
        # Reads echl_player_seasons (stats step). NHL_SEASON/PWHL_SEASON
        # are env fallbacks for modules trivia_questions.py imports at load,
        # as in pwhl-nightly.yml's trivia step.

      - name: Notify on failure
        if: failure()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          POLL_SECRET: ${{ secrets.EYEWALL_POLL_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "${WORKER_URL:-https://eyewall-poller.billowing-queen-bf23.workers.dev}/ops/notify?secret=$POLL_SECRET" -H 'content-type: application/json' -d "{\"source\":\"echl-nightly.yml\",\"status\":\"failure\",\"title\":\"EyeWall ECHL Nightly Pipeline failed\",\"body\":\"$RUN_URL\",\"url\":\"$RUN_URL\"}"

      - name: Report success
        if: success()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          POLL_SECRET: ${{ secrets.EYEWALL_POLL_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "${WORKER_URL:-https://eyewall-poller.billowing-queen-bf23.workers.dev}/ops/notify?secret=$POLL_SECRET" -H 'content-type: application/json' -d "{\"source\":\"echl-nightly.yml\",\"status\":\"ok\",\"title\":\"EyeWall ECHL Nightly Pipeline succeeded\",\"body\":\"$RUN_URL\",\"url\":\"$RUN_URL\"}"
